[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aceapex-fast"
version = "0.1.0"
description = "The FAST profile of ACEAPEX: LZ77 with fixed 32-bit tokens, fast decode and byte-range access (C99 core)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Yakiv Shavidze", email = "aceapex.contour@outlook.com" }]
classifiers = ["Programming Language :: C", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.urls]
Source = "https://github.com/yasha1971-coder/aceapex-fast"

[tool.setuptools]
packages = ["aceapex_fast"]

[tool.cibuildwheel]
test-requires = "pytest"
test-command = "pytest {project}/python/tests -q"
